name: Monthly Financial Data Update

on:
  schedule:
    - cron: '50 14 28-31 * *' # 毎月月末付近の日本時間23:50に実行
  workflow_dispatch: # 手動実行用ボタン

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check if today is the last day of the month
        id: check-date
        run: |
          TOMORROW=$(date -d "+1 day" +%d)
          if [ "$TOMORROW" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_job=true" >> $GITHUB_ENV
          else
            echo "run_job=false" >> $GITHUB_ENV
          fi

      - name: Checkout repository
        if: env.run_job == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.run_job == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: env.run_job == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Run Scraper
        if: env.run_job == 'true'
        run: python scripts/fetch_data.py

      - name: Commit and push changes
        if: env.run_job == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/quizData.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "データ自動更新: $(date +'%Y-%m-%d')"
            git push
          fi
